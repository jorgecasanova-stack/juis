<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0F0E17" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JUIS" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>JUIS</title>
<style>
  :root{
    --bg:#0E1B25; --card:#17262F; --soft:#21333D; --accent:#E3B450;
    --text:#F4EEE0; --muted:#9FB1BD; --green:#5BD08A; --border:#2B3C46;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{padding-bottom:env(safe-area-inset-bottom);min-height:100vh;
    background:radial-gradient(120% 80% at 50% 0%, #163142 0%, #0E1B25 55%, #0A141C 100%) fixed}
  .serif{font-family:Georgia,"Times New Roman",serif}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(11,20,28,.92);
    backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;border-bottom:1px solid var(--border)}
  .logo-img{height:32px;display:block;cursor:pointer}
  .topbtn{background:none;border:0;color:var(--accent);font-weight:700;font-size:15px;cursor:pointer}
  .wrap{max-width:620px;margin:0 auto;padding:16px 16px 48px}
  .kicker{font-size:12px;font-weight:800;letter-spacing:1.5px;margin:4px 0 8px}
  .section{color:var(--text);font-size:20px;font-weight:800;margin:24px 0 10px}

  /* ----- HOME: cajas de colección ----- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px}
  .ctile{position:relative;border-radius:18px;padding:18px 16px 16px;min-height:170px;
    display:flex;flex-direction:column;cursor:pointer;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
  .ctile .clabel{font-size:11px;font-weight:800;letter-spacing:2px;opacity:.9}
  .ctile .cname{font-size:24px;font-weight:700;line-height:1.05;margin:10px 0 4px}
  .ctile .ctag{font-size:13px;opacity:.7;flex:1}
  .ctile .cstatus{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;margin-top:12px}
  .cdot{width:8px;height:8px;border-radius:50%;display:inline-block}

  /* ----- listas / tarjetas ----- */
  .hero{border-radius:20px;overflow:hidden;background:var(--card);position:relative;cursor:pointer}
  .hero img{width:100%;height:280px;object-fit:cover;display:block}
  .hero .ov{padding:16px;position:absolute;left:0;right:0;bottom:0;
    background:linear-gradient(transparent,rgba(15,14,23,.55) 35%,rgba(15,14,23,.92))}
  .hero .era{font-size:12px;font-weight:800;letter-spacing:1px}
  .hero .name{font-size:30px;font-weight:700;margin:2px 0}
  .hero .title{color:var(--muted);font-size:15px}
  .play-pill{margin-top:12px;display:inline-block;color:#1A1500;font-weight:800;font-size:14px;
    padding:9px 16px;border-radius:30px}
  .row{display:flex;align-items:center;background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer}
  .row img,.thumb{width:60px;height:60px;border-radius:10px;object-fit:cover;background:var(--soft);flex:0 0 auto}
  .thumb{display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:800;font-size:24px}
  .row .body{flex:1;margin-left:12px;min-width:0}
  .row .nm{color:var(--text);font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .tt{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row .mt{font-size:11px;margin-top:3px}
  .badge{margin-left:8px;font-size:18px;font-weight:800;flex:0 0 auto}
  .badge.h{color:var(--green)} .badge.n{font-size:11px}
  .ministars{color:var(--accent);font-size:12px;margin-top:2px;letter-spacing:1px}
  .pbar-mini{height:4px;border-radius:2px;background:var(--soft);margin-top:6px;overflow:hidden}
  .pbar-mini>i{display:block;height:100%}
  /* bloqueado: blur + candado, sin cuenta atrás */
  .row.locked{cursor:default}
  .row.locked .nm,.row.locked .tt,.row.locked img{filter:blur(5px)}
  .row.locked .thumb{filter:none;font-size:22px}
  .soon{flex:0 0 auto;margin-left:8px;font-size:11px;font-weight:800;color:var(--accent);
    border:1px solid var(--border);border-radius:20px;padding:4px 9px;white-space:nowrap}

  /* ----- player ----- */
  .cover{width:100%;height:320px;border-radius:18px;object-fit:cover;background:var(--card)}
  .ph{display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:800}
  .p-era{font-size:12px;font-weight:800;letter-spacing:1.5px;margin-top:18px}
  .p-name{font-size:32px;font-weight:700;margin:4px 0 0}
  .p-title{color:var(--muted);font-size:16px;margin-top:2px}
  .track{height:7px;border-radius:4px;background:var(--soft);margin-top:28px;overflow:hidden;cursor:pointer}
  .track>i{display:block;height:100%;background:var(--accent);width:0}
  .times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
  .controls{display:flex;align-items:center;justify-content:center;gap:30px;margin-top:18px}
  .ctrl{background:none;border:0;color:var(--text);font-size:17px;font-weight:700;cursor:pointer}
  .playbtn{width:74px;height:74px;border-radius:50%;background:var(--accent);color:#1A1500;border:0;
    font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .heardbtn{display:block;margin:22px auto 0;border:1px solid var(--border);background:none;color:var(--muted);
    font-weight:700;padding:11px 22px;border-radius:30px;cursor:pointer}
  .heardbtn.on{border-color:var(--green);color:var(--green);background:var(--soft)}
  .rate{margin-top:22px;text-align:center;background:var(--card);border-radius:16px;padding:16px}
  .rate .q{color:var(--muted);font-size:14px;font-weight:700}
  .stars{font-size:34px;letter-spacing:6px;margin-top:8px;cursor:pointer;user-select:none}
  .stars span{color:#3a4a55;transition:color .1s}
  .stars span.on{color:var(--accent)}
  .ghost{display:block;width:100%;margin-top:22px;background:var(--card);border:1px solid var(--border);
    color:var(--accent);font-weight:700;font-size:15px;padding:13px;border-radius:12px;cursor:pointer}
  .script{color:var(--muted);font-size:15px;line-height:1.6;white-space:pre-wrap;margin-top:14px}
  .script[hidden]{display:none}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
  .tag{background:var(--card);color:var(--muted);padding:6px 12px;border-radius:20px;font-size:13px}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:24px;color:var(--muted)}
  .btn{background:var(--accent);color:#1A1500;border:0;font-weight:800;padding:11px 22px;border-radius:30px;cursor:pointer;margin-top:16px}
  #install{display:none}
</style>
</head>
<body>
  <div class="topbar">
    <img class="logo-img" src="logo-wide.png" alt="JUIS" onclick="go('home')" />
    <div>
      <button class="topbtn" id="install">Instalar</button>
      <button class="topbtn" id="navBtn" onclick="go('home')">Inicio</button>
    </div>
  </div>
  <div class="wrap" id="screen"></div>
  <audio id="audio" preload="metadata"></audio>

<script>
const $ = (id) => document.getElementById(id);
const screen = $('screen');
const audio = $('audio');

// Colecciones (orden y estilo de la portada)
const COLLECTIONS = [
  { key:'historia', name:'Personajes históricos', tag:'Reyes, genios y tiranos',         bg:'#15131d', accent:'#E3B450' },
  { key:'kids',     name:'JUIS Kids',             tag:'Historia para peques',            bg:'#5a2a82', accent:'#FFD166' },
  { key:'deporte',  name:'Deportistas',           tag:'Leyendas y hazañas del deporte',  bg:'#0d3b1e', accent:'#5BD08A' },
  { key:'eventos',  name:'Acontecimientos',       tag:'Batallas, guerras e imperios',    bg:'#0b2f6b', accent:'#8FB3FF' },
];
const collOf = (e) => e.coleccion || 'historia';
const collMeta = (k) => COLLECTIONS.find(c=>c.key===k) || COLLECTIONS[0];

let M = null, view = 'home', currentColl = 'historia', currentId = null;

const heard = () => JSON.parse(localStorage.getItem('juis.heard')||'{}');
const setHeard = (id,v)=>{const m=heard(); v?m[id]=1:delete m[id]; localStorage.setItem('juis.heard',JSON.stringify(m));};
const progress = () => JSON.parse(localStorage.getItem('juis.progress')||'{}');
const setProg = (id,s)=>{const m=progress(); m[id]=s; localStorage.setItem('juis.progress',JSON.stringify(m));};
const ratings = () => JSON.parse(localStorage.getItem('juis.rating')||'{}');
const setRating = (id,n)=>{const m=ratings(); m[id]=n; localStorage.setItem('juis.rating',JSON.stringify(m));};

const ep = (id) => M.episodes.find(e=>e.id===id);
const fmt = (s)=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const esc = (t)=>(t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// Desbloqueo diario por colección: 3 al empezar, +1 cada día (fecha guardada en este móvil)
const START_UNLOCKED = 3;
function daysSinceStart(){
  let start = localStorage.getItem('juis.start');
  if(!start){ start = new Date().toISOString().slice(0,10); localStorage.setItem('juis.start', start); }
  return Math.floor((Date.now() - new Date(start+'T00:00:00').getTime())/86400000);
}
function collEpisodes(k){ return M.episodes.filter(e=>collOf(e)===k).sort((a,b)=>a.order-b.order); }
function unlockInfo(k){
  const all = collEpisodes(k);
  const count = Math.min(all.length, Math.max(START_UNLOCKED, START_UNLOCKED + daysSinceStart()));
  return { available: all.slice(0,count), locked: all.slice(count) };
}

async function init(){
  if('serviceWorker' in navigator){ try{ await navigator.serviceWorker.register('sw.js'); }catch(e){} }
  try{
    const res = await fetch('manifest.json?t='+Date.now(), {cache:'no-store'});
    if(!res.ok) throw 0;
    M = await res.json();
    render();
  }catch(e){
    screen.innerHTML = `<div class="center"><p>No se pudo cargar el contenido.<br>Revisa la conexión.</p>
      <button class="btn" onclick="init()">Reintentar</button></div>`;
  }
}

function go(v, arg){
  if(v==='home'){ view='home'; }
  else if(v==='coll'){ view='coll'; currentColl=arg; }
  else if(v==='player'){ view='player'; currentId=arg; }
  render(); window.scrollTo(0,0);
}

function render(){
  $('navBtn').style.display = (view==='home') ? 'none' : 'inline';
  if(view==='home') renderHome();
  else if(view==='coll') renderColl();
  else renderPlayer();
}

const imgTag = (e, cls) => e.image
  ? `<img class="${cls}" src="${e.image}" alt="">`
  : `<div class="${cls} ph" ${cls==='cover'?'style="font-size:64px"':''}>${esc(e.name[0])}</div>`;

/* ---------- HOME (4 cajas) ---------- */
function renderHome(){
  const H = heard();
  let cards = COLLECTIONS.map(c=>{
    const { available } = unlockInfo(c.key);
    const pend = available.filter(e=>!H[e.id]).length;
    const status = pend===0 ? 'Al día' : (pend===1 ? '1 pendiente' : pend+' pendientes');
    const dot = pend===0 ? 'var(--green)' : c.accent;
    return `<div class="ctile" style="background:${c.bg}" onclick="go('coll','${c.key}')">
      <div class="clabel" style="color:${c.accent}">COLECCIÓN</div>
      <div class="cname serif">${esc(c.name)}</div>
      <div class="ctag">${esc(c.tag)}</div>
      <div class="cstatus" style="color:${pend===0?'var(--green)':c.accent}">
        <span class="cdot" style="background:${dot}"></span>${status}</div>
    </div>`;
  }).join('');
  screen.innerHTML = `<div class="kicker" style="color:var(--accent)">TU DÍA EN JUIS</div>
    <div class="grid">${cards}</div>`;
}

/* ---------- COLECCIÓN (lista) ---------- */
function renderColl(){
  const H = heard(), P = progress(), c = collMeta(currentColl);
  const { available, locked } = unlockInfo(currentColl);
  const desc = [...available].sort((a,b)=>b.order-a.order);
  const hero = desc.find(e=>!H[e.id]) || desc[0];
  const cont = hero ? desc.filter(e=>!H[e.id] && (P[e.id]||0)>5 && e.id!==hero.id) : [];
  const noOidos = hero ? desc.filter(e=>!H[e.id] && e.id!==hero.id && !cont.includes(e)) : [];
  const oidos = desc.filter(e=>H[e.id]);

  let html = `<div class="kicker" style="color:${c.accent}">${esc(c.name).toUpperCase()}</div>`;
  if(hero){
    html += `<div class="hero" onclick="go('player','${hero.id}')">${imgTag(hero,'')}
      <div class="ov">
        <div class="era" style="color:${c.accent}">${esc(hero.era).toUpperCase()}</div>
        <div class="name serif">${esc(hero.name)}</div>
        <div class="title">${esc(hero.title)}</div>
        <span class="play-pill" style="background:${c.accent}">▶ Escuchar · ${fmt(hero.duration)}</span>
      </div></div>`;
  }
  if(cont.length) html += `<div class="section">Continuar</div>`+cont.map(e=>rowCard(e,H,P,c)).join('');
  if(noOidos.length) html += `<div class="section">No escuchados</div>`+noOidos.map(e=>rowCard(e,H,P,c)).join('');
  if(oidos.length) html += `<div class="section">Ya escuchados</div>`+oidos.map(e=>rowCard(e,H,P,c)).join('');
  if(locked.length) html += `<div class="section">Próximamente</div>`+locked.map(e=>lockedCard(e)).join('');
  screen.innerHTML = html;
}

function rowCard(e,H,P,c){
  const pct = e.duration ? Math.min(100,((P[e.id]||0)/e.duration)*100) : 0;
  const r = ratings()[e.id];
  return `<div class="row" onclick="go('player','${e.id}')">${imgTag(e,'')}
    <div class="body">
      <div class="nm">${esc(e.name)}</div>
      <div class="tt">${esc(e.title)}</div>
      <div class="mt" style="color:${c.accent}">${esc(e.era)} · ${fmt(e.duration)}</div>
      ${r?`<div class="ministars">${'★'.repeat(r)}${'☆'.repeat(5-r)}</div>`:''}
      ${pct>1 && !H[e.id] ? `<div class="pbar-mini"><i style="width:${pct}%;background:${c.accent}"></i></div>`:''}
    </div>
    <span class="badge ${H[e.id]?'h':'n'}" style="${H[e.id]?'':'color:'+c.accent}">${H[e.id]?'✓':'●'}</span>
  </div>`;
}
function lockedCard(e){
  return `<div class="row locked">${imgTag(e,'')}
    <div class="body"><div class="nm">${esc(e.name)}</div><div class="tt">${esc(e.title)}</div></div>
    <span class="soon">🔒 Próximamente</span></div>`;
}

/* ---------- PLAYER ---------- */
let curVoice = 'alvaro';
function renderPlayer(){
  const e = ep(currentId), H = heard(), c = collMeta(collOf(e));
  curVoice = Object.keys(e.audio)[0];
  const r = ratings()[e.id] || 0;
  screen.innerHTML = `
    ${imgTag(e,'cover')}
    <div class="p-era" style="color:${c.accent}">${esc(e.era).toUpperCase()}</div>
    <div class="p-name serif">${esc(e.name)}</div>
    <div class="p-title">${esc(e.title)}</div>
    <div class="track" id="track"><i id="fill" style="background:${c.accent}"></i></div>
    <div class="times"><span id="tcur">0:00</span><span id="tdur">${fmt(e.duration)}</span></div>
    <div class="controls">
      <button class="ctrl" onclick="seek(-15)">« 15</button>
      <button class="playbtn" id="playbtn" onclick="togglePlay()" style="background:${c.accent}">▶</button>
      <button class="ctrl" onclick="seek(15)">15 »</button>
    </div>
    <button class="heardbtn ${H[e.id]?'on':''}" id="heardbtn" onclick="toggleHeard()">
      ${H[e.id]?'✓ Escuchado':'Marcar como escuchado'}</button>
    <div class="rate">
      <div class="q" id="rateq">${r?'Tu valoración':'¿Qué te ha parecido?'}</div>
      <div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<span data-n="${n}" class="${n<=r?'on':''}" onclick="rate(${n})">★</span>`).join('')}</div>
    </div>
    ${e.tags?.length?`<div class="tags">${e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
    <button class="ghost" id="scriptBtn" onclick="toggleScript()">📄 Ver transcripción</button>
    <div class="script" id="scriptBox" hidden>${esc(e.script)}</div>`;
  loadAudio(e,false);
  $('track').onclick=(ev)=>{const rc=ev.currentTarget.getBoundingClientRect();
    if(audio.duration) audio.currentTime=((ev.clientX-rc.left)/rc.width)*audio.duration;};
}

function rate(n){
  setRating(currentId, n);
  const stars = $('stars'); if(stars){ [...stars.children].forEach(s=>s.classList.toggle('on', +s.dataset.n<=n)); }
  const q=$('rateq'); if(q) q.textContent='¡Gracias! Tu valoración';
}

function loadAudio(e, autoplay){
  const src = e.audio[curVoice];
  const full = new URL(src, location.href).href;
  if(audio.src !== full){
    audio.src = src;
    const p = progress()[e.id] || 0;
    audio.addEventListener('loadedmetadata', function once(){
      if(p>0 && p < (audio.duration||1e9)-5) audio.currentTime = p;
      audio.removeEventListener('loadedmetadata', once);
    });
  }
  setMediaSession(e);
  if(autoplay) audio.play();
  syncPlayBtn();
}
function togglePlay(){ if(!audio.src){ loadAudio(ep(currentId),true); return; } audio.paused?audio.play():audio.pause(); }
function seek(d){ if(audio.duration) audio.currentTime=Math.max(0,Math.min(audio.duration,audio.currentTime+d)); }
function syncPlayBtn(){ const b=$('playbtn'); if(b) b.textContent=audio.paused?'▶':'❚❚'; }
function toggleScript(){ const box=$('scriptBox'),btn=$('scriptBtn'); if(!box)return;
  if(box.hasAttribute('hidden')){box.removeAttribute('hidden');btn.textContent='📄 Ocultar transcripción';}
  else{box.setAttribute('hidden','');btn.textContent='📄 Ver transcripción';} }
function toggleHeard(){ const id=currentId,now=!heard()[id]; setHeard(id,now);
  const b=$('heardbtn'); if(b){b.classList.toggle('on',now);b.textContent=now?'✓ Escuchado':'Marcar como escuchado';} }

function setMediaSession(e){
  if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({title:e.name,artist:e.title,album:'JUIS',
    artwork:e.image?[{src:new URL(e.image,location.href).href,sizes:'512x512',type:'image/jpeg'}]:[]});
  navigator.mediaSession.setActionHandler('play',()=>audio.play());
  navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
  navigator.mediaSession.setActionHandler('seekbackward',()=>seek(-15));
  navigator.mediaSession.setActionHandler('seekforward',()=>seek(15));
}

audio.addEventListener('timeupdate',()=>{
  if(view!=='player'||!currentId) return;
  const fill=$('fill'),tcur=$('tcur');
  if(fill&&audio.duration) fill.style.width=(audio.currentTime/audio.duration*100)+'%';
  if(tcur) tcur.textContent=fmt(audio.currentTime);
  if(audio.duration){
    if(Math.floor(audio.currentTime)%4===0) setProg(currentId,Math.floor(audio.currentTime));
    if(audio.currentTime/audio.duration>0.92 && !heard()[currentId]){
      setHeard(currentId,1);
      const b=$('heardbtn'); if(b){b.classList.add('on');b.textContent='✓ Escuchado';}
    }
  }
});
audio.addEventListener('play',syncPlayBtn);
audio.addEventListener('pause',()=>{syncPlayBtn(); if(currentId) setProg(currentId,Math.floor(audio.currentTime));});
audio.addEventListener('ended',()=>{ if(currentId){ setHeard(currentId,1);
  const q=$('rateq'); if(q && !ratings()[currentId]) q.textContent='¿Qué te ha parecido? ¡Puntúalo!'; }});

let deferred;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferred=e;$('install').style.display='inline';});
$('install').onclick=async()=>{ if(deferred){deferred.prompt();deferred=null;$('install').style.display='none';} };

init();
</script>
</body>
</html>
